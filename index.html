<!DOCTYPE html>
<html>
  <head>
    <title>Hokago</title>
    <meta charset="UTF-8">
    <meta name="description" content="Hokago Magazine. An escape for students across the world."> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background-color: bisque;
            margin:0px;
            overflow: hidden;
        }
        .container {
            display: grid;
            background-color: rgb(255, 255, 255);
            max-width: 75%;
            height: 100vh;
            margin: auto;
            grid-template-columns: 0.9fr 1fr 1fr;
            grid-template-rows: 200px 180px 90px 250px 200px; 
            grid-template-areas:
            "header header header"
            "sidebar about about"
            "sidebar music music"
            "new-articles new-articles new-articles"
            "test test test";
            overflow: scroll;
        }
        nav {
            background-color: rgb(143, 143, 215);
            position:sticky;
            height: 40px;
        }
        header {
            background-color: rgb(175, 97, 224);
            grid-area: header;
            border-radius:0px 0px 15px 15px;
        }
        .sidebar {
            background-color: rgb(97, 203, 224);
            grid-area: sidebar;
            margin-top: 10px;
            border-radius: 15px;
        }
        .about {
            background-color: rgb(97, 122, 224);
            grid-area: about;
            margin: 10px 0px 0px 10px;
            border-radius: 15px;
        }
        .music {
            background-color: rgb(170, 220, 255);
            grid-area: music;
            margin:10px 30px 0px 40px;
            border-radius: 15px;
        }
        .new-articles {
            background-color: rgb(48, 59, 129);
            grid-area: new-articles;
            margin-top: 10px;
            border-radius: 15px;
        }
        .test {
            grid-area: test;
        }

    </style>
    
  </head>

    <body>
        <nav>nav</nav>
       <div class="container">
            <header>header</header>
            <div class="sidebar">
                <ul>
                    <li>update 1</li>
                    <li>update 2</li>
                    <li>update 3</li>
                </ul>
            </div>
            <div class="about">about</div>
            <div class="music">music</div>
            <div class="new-articles">new articles</div>
            <div class="test">uhhhh</div>
       </div>
    </body>
</html>
